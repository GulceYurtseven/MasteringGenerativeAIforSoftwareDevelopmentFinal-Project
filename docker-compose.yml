version: '3.8'

services:
  # Node.js Uygulamamız
  api-service:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      # DİKKAT: Artık localhost veya bulut IP'si değil, doğrudan diğer konteynerin adını (mongodb-server) veriyoruz
      - MONGO_URI=mongodb://mongodb-server:27017/usermngtservice
      - JWT_SECRET=super_gizli_anahtar_123
    depends_on:
      - mongodb-server

  # MongoDB Veritabanımız
  mongodb-server:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      # Verilerin konteyner silinse bile kaybolmaması için kalıcı bir alan (volume) oluşturuyoruz
      - mongo-data:/data/db

volumes:
  mongo-data: